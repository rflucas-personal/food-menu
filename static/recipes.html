<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Receitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="global-nav no-print">
        <div class="nav-container">
            <a href="/" class="nav-link">Gerador de Cardápios</a>
            <a href="/recipes.html" class="nav-link active">Gerenciador de Receitas</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1400px; display: grid; grid-template-columns: 350px 1fr; gap: 2rem;">
        
        <!-- Sidebar: Lista de Receitas -->
        <aside class="recipes-sidebar glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Receitas</h2>
                <button id="btn-new-recipe" class="btn-primary" style="padding: 0.5rem 1rem; width: auto; font-size: 0.9rem;">+ Nova</button>
            </div>
            
            <div class="recipe-filters">
                <input type="text" id="recipe-search" placeholder="Buscar receita..." style="width: 100%; margin-bottom: 1rem; padding: 0.5rem; border-radius: var(--radius-md); border: 1px solid var(--glass-border);">
            </div>

            <ul id="recipes-list" class="cardapio-list" style="max-height: calc(100vh - 250px);">
                <li class="loading-text">Carregando...</li>
            </ul>
        </aside>

        <!-- Main Content: Formulário de Edição -->
        <main class="recipe-editor glass-panel" style="position: relative;">
            <div id="empty-editor-state" class="empty-state" style="margin-top: 4rem;">
                Selecione uma receita na lateral ou crie uma nova.
            </div>

            <form id="recipe-form" class="hidden">
                <input type="hidden" id="recipe-id">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="form-group">
                        <label for="titulo">Título da Receita</label>
                        <input type="text" id="titulo" required>
                    </div>
                    
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                        <div>
                            <label for="tipo">Tipo</label>
                            <select id="tipo" required>
                                <option value="proteina">Proteína</option>
                                <option value="acompanhamento">Acompanhamento</option>
                                <option value="complemento">Complemento</option>
                            </select>
                        </div>
                        <div>
                            <label for="porcoes">Porções Rende</label>
                            <input type="number" id="porcoes" min="1" required>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="form-group">
                        <label for="tags">Tags (separadas por vírgula)</label>
                        <input type="text" id="tags" placeholder="ex: frango, forno, saúdavel">
                    </div>
                    
                    <div class="form-group">
                        <label for="fonte">Fonte</label>
                        <input type="text" id="fonte">
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 2rem 0;">

                <div class="editor-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3>Ingredientes</h3>
                        <button type="button" id="btn-add-ingredient" class="btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.85rem; margin-top: 0;">+ Adicionar Ingrediente</button>
                    </div>
                    <div id="ingredients-container" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Injetado dinamicamente -->
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 2rem 0;">

                <div class="editor-section" style="margin-bottom: 5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3>Modo de Preparo</h3>
                        <button type="button" id="btn-add-step" class="btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.85rem; margin-top: 0;">+ Adicionar Passo</button>
                    </div>
                    <div id="steps-container" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Injetado dinamicamente -->
                    </div>
                </div>

                <div style="position: absolute; bottom: 1.5rem; right: 2rem;">
                    <button type="submit" class="btn-success" id="btn-save-recipe" style="width: auto; padding: 0.75rem 2rem;">💾 Salvar Alterações</button>
                </div>
            </form>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <span class="toast-icon">✅</span>
            <div class="toast-message">
                <strong id="toast-title">Sucesso!</strong>
                <p id="toast-desc">Ação realizada com sucesso.</p>
            </div>
        </div>
    </div>

    <script src="recipes.js"></script>
</body>
</html>
