name: 🚀 Deploy para GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Servir a pasta static/ como raiz do site (sem gerador de site estático)
          static_site_generator: none
          # Habilita o GitHub Pages automaticamente (source: GitHub Actions)
          # na primeira execução, caso ainda não esteja habilitado.
          enablement: true

      - name: 📦 Fazer upload do artefato (pasta static/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'static/'

      - name: 🚀 Fazer deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
